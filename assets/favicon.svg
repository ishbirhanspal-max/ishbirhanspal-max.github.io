<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <defs>
    <linearGradient id="optiGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="48" height="48" rx="12" fill="#0b0f19" />
  <rect x="2" y="2" width="44" height="44" rx="10" fill="none" stroke="url(#optiGrad)" stroke-width="1.5" opacity="0.4" />
  
  <!-- Image Frame -->
  <rect x="10" y="10" width="28" height="28" rx="6" fill="url(#optiGrad)" fill-opacity="0.15" stroke="url(#optiGrad)" stroke-width="2" />
  
  <!-- Mountain / Wave -->
  <path d="M12 32 L20 22 L26 29 L32 20 L36 28 L36 34 L12 34 Z" fill="url(#optiGrad)" opacity="0.8" />
  
  <!-- Sun / Sparkle -->
  <circle cx="19" cy="18" r="3.5" fill="#38bdf8" filter="url(#glow)" />
  
  <!-- Compression Lightning / Arrows -->
  <path d="M30 11 L35 16 L31 16 L31 22 L29 22 L29 16 L25 16 Z" fill="#a855f7" />
  <path d="M18 37 L13 32 L17 32 L17 26 L19 26 L19 32 L23 32 Z" fill="#06b6d4" />
